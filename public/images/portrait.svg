<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192837" />
      <stop offset="50%" stop-color="#0F1B27" />
      <stop offset="100%" stop-color="#080F16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" />
      <stop offset="100%" stop-color="#E2CCA8" />
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243445" />
      <stop offset="100%" stop-color="#121D28" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9A982" />
      <stop offset="100%" stop-color="#BF8B63" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#C5A880" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  
  <!-- Subtle Editorial Architectural Grid -->
  <circle cx="400" cy="400" r="320" stroke="url(#accentGrad)" stroke-width="1" stroke-opacity="0.2" fill="url(#glowGrad)" />
  <circle cx="400" cy="400" r="240" stroke="#C5A880" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8" />
  <line x1="80" y1="80" x2="720" y2="80" stroke="#C5A880" stroke-opacity="0.15" stroke-width="1" />
  <line x1="80" y1="920" x2="720" y2="920" stroke="#C5A880" stroke-opacity="0.15" stroke-width="1" />
  <line x1="80" y1="80" x2="80" y2="920" stroke="#C5A880" stroke-opacity="0.15" stroke-width="1" />
  <line x1="720" y1="80" x2="720" y2="920" stroke="#C5A880" stroke-opacity="0.15" stroke-width="1" />

  <!-- Monogram Watermark Background -->
  <text x="400" y="520" text-anchor="middle" font-family="'Geist', 'Inter', sans-serif" font-size="280" font-weight="900" fill="#FFFFFF" fill-opacity="0.025" letter-spacing="-8">SR</text>

  <!-- Professional Figure Silhouette -->
  <!-- Shoulders & Suit -->
  <path d="M160 1000 C160 840 220 740 320 710 L400 780 L480 710 C580 740 640 840 640 1000 Z" fill="url(#suitGrad)" />
  
  <!-- White Shirt & Tie -->
  <polygon points="400,780 360,710 440,710" fill="#FFFFFF" />
  <polygon points="400,780 388,710 412,710" fill="#E8EEF5" />
  <polygon points="392,720 408,720 404,890 396,890" fill="#0C151F" />
  <polygon points="395,710 405,710 407,725 393,725" fill="url(#accentGrad)" />

  <!-- Lapels -->
  <polygon points="320,710 380,870 340,890 280,750" fill="#1C2B3A" />
  <polygon points="480,710 420,870 460,890 520,750" fill="#1C2B3A" />

  <!-- Neck -->
  <path d="M370 650 L370 730 L430 730 L430 650 Z" fill="url(#skinGrad)" />

  <!-- Head / Face -->
  <ellipse cx="400" cy="540" rx="105" ry="135" fill="url(#skinGrad)" />

  <!-- Professional Hair -->
  <path d="M295 530 C295 410 330 380 400 380 C470 380 505 410 505 530 C490 440 460 410 400 410 C340 410 310 440 295 530 Z" fill="#151E28" />

  <!-- Glasses (Editorial Academic Touch) -->
  <rect x="330" y="505" width="55" height="40" rx="10" stroke="#C5A880" stroke-width="4" fill="#FFFFFF" fill-opacity="0.12" />
  <rect x="415" y="505" width="55" height="40" rx="10" stroke="#C5A880" stroke-width="4" fill="#FFFFFF" fill-opacity="0.12" />
  <line x1="385" y1="522" x2="415" y2="522" stroke="#C5A880" stroke-width="4" />
  <line x1="310" y1="520" x2="330" y2="520" stroke="#C5A880" stroke-width="3" />
  <line x1="470" y1="520" x2="490" y2="520" stroke="#C5A880" stroke-width="3" />

  <!-- Subtle Facial Features -->
  <path d="M385 595 Q400 605 415 595" stroke="#8C5C38" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Gold Lapel Pin -->
  <circle cx="345" cy="785" r="7" fill="url(#accentGrad)" />
  <circle cx="345" cy="785" r="4" fill="#0C151F" />

  <!-- Floating Editorial Credential Badge -->
  <g transform="translate(100, 840)">
    <rect width="600" height="96" rx="12" fill="#0C1722" fill-opacity="0.92" stroke="#C5A880" stroke-width="1.5" />
    <text x="30" y="42" font-family="'Geist', 'Inter', sans-serif" font-size="13" font-weight="700" fill="#C5A880" letter-spacing="2">COMMERCE &amp; ACCOUNTING EDUCATOR</text>
    <text x="30" y="70" font-family="'Geist', 'Inter', sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Suman Ranabhat</text>
    <text x="570" y="56" text-anchor="end" font-family="'Geist', 'Inter', sans-serif" font-size="13" font-weight="500" fill="#9FB3C8">Commerce Educator</text>
  </g>
</svg>
